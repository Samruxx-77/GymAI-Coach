<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset=".55" stop-color="#0a0e15"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="hazeL" cx=".28" cy=".18" r=".55">
      <stop offset="0" stop-color="#8b93a6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#8b93a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hazeR" cx=".78" cy=".12" r=".5">
      <stop offset="0" stop-color="#6f7a92" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6f7a92" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cfdd" stop-opacity=".22"/>
      <stop offset=".7" stop-color="#c7cfdd" stop-opacity=".05"/>
      <stop offset="1" stop-color="#c7cfdd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10141c"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aeb7c9" stop-opacity=".12"/>
      <stop offset="1" stop-color="#aeb7c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39404e"/>
      <stop offset=".45" stop-color="#171c26"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="steelHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58627a"/>
      <stop offset=".5" stop-color="#232a38"/>
      <stop offset="1" stop-color="#10141c"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#hazeL)"/>
  <rect width="1600" height="1000" fill="url(#hazeR)"/>

  <!-- ceiling rig -->
  <g opacity=".8">
    <rect x="0" y="0" width="1600" height="10" fill="#05070a"/>
    <g stroke="#1c2230" stroke-width="3">
      <line x1="300" y1="8" x2="300" y2="120"/>
      <line x1="760" y1="8" x2="760" y2="90"/>
      <line x1="1220" y1="8" x2="1220" y2="128"/>
    </g>
    <g fill="#151a24" stroke="#232b3b" stroke-width="2">
      <path d="M262 120h76l-10 34h-56z"/>
      <path d="M726 90h68l-9 30h-50z"/>
      <path d="M1186 128h68l-9 30h-50z"/>
    </g>
    <ellipse cx="300" cy="158" rx="66" ry="14" fill="#d7dee9" opacity=".5" filter="url(#soft)"/>
    <ellipse cx="760" cy="123" rx="58" ry="12" fill="#cdd6e4" opacity=".45" filter="url(#soft)"/>
    <ellipse cx="1220" cy="161" rx="60" ry="12" fill="#d7dee9" opacity=".45" filter="url(#soft)"/>
  </g>

  <!-- light cones -->
  <polygon points="258,150 342,150 470,760 130,760" fill="url(#cone)"/>
  <polygon points="724,118 796,118 906,720 614,720" fill="url(#cone)" opacity=".85"/>
  <polygon points="1184,156 1256,156 1378,750 1062,750" fill="url(#cone)" opacity=".9"/>

  <!-- back wall racks (silhouette) -->
  <g opacity=".55" fill="#0e1219">
    <rect x="60" y="380" width="270" height="14"/>
    <rect x="60" y="470" width="270" height="14"/>
    <rect x="60" y="560" width="270" height="14"/>
    <rect x="46" y="340" width="16" height="320"/>
    <rect x="328" y="340" width="16" height="320"/>
    <!-- plates on rack -->
    <g fill="#131924">
      <circle cx="120" cy="432" r="34"/><circle cx="170" cy="432" r="30"/>
      <circle cx="222" cy="522" r="34"/><circle cx="272" cy="522" r="28"/>
      <circle cx="130" cy="612" r="30"/><circle cx="252" cy="612" r="34"/>
    </g>
    <!-- squat stand right -->
    <rect x="1360" y="300" width="18" height="380"/>
    <rect x="1500" y="300" width="18" height="380"/>
    <rect x="1360" y="440" width="158" height="12"/>
    <rect x="1360" y="540" width="158" height="12"/>
  </g>

  <!-- leaning barbell, center-left -->
  <g transform="translate(560 706) rotate(-4)">
    <ellipse cx="240" cy="66" rx="300" ry="26" fill="#000" opacity=".5" filter="url(#soft2)"/>
    <rect x="-20" y="-8" width="520" height="16" rx="8" fill="url(#steelHi)"/>
    <rect x="-20" y="-8" width="520" height="5" rx="2.5" fill="#7c8798" opacity=".55"/>
    <g>
      <rect x="-52" y="-64" width="34" height="128" rx="14" fill="url(#steelHi)"/>
      <rect x="-8" y="-58" width="16" height="116" rx="8" fill="url(#steel)"/>
      <rect x="452" y="-58" width="16" height="116" rx="8" fill="url(#steel)"/>
      <rect x="474" y="-64" width="34" height="128" rx="14" fill="url(#steelHi)"/>
    </g>
    <g fill="#151b27" stroke="#28303f" stroke-width="2">
      <circle cx="-35" cy="0" r="64"/><circle cx="-35" cy="0" r="26" fill="#0d1118"/>
    </g>
    <circle cx="-35" cy="-64" r="5" fill="#9aa5b8" opacity=".7"/>
  </g>

  <!-- kettlebell foreground right -->
  <g transform="translate(1180 780)">
    <ellipse cx="0" cy="96" rx="150" ry="18" fill="#000" opacity=".45" filter="url(#soft2)"/>
    <path d="M-30 -84 C -66 -84 -74 -40 -46 -18 C -84 6 -104 44 -104 74 A 104 84 0 0 0 104 74 C 104 44 84 6 46 -18 C 74 -40 66 -84 30 -84 Z"
          fill="url(#steelHi)" stroke="#2a3242" stroke-width="3"/>
    <ellipse cx="-34" cy="36" rx="20" ry="30" fill="#3d4658" opacity=".35" transform="rotate(-18)"/>
  </g>

  <!-- floor -->
  <rect y="770" width="1600" height="230" fill="url(#floor)"/>
  <rect y="770" width="1600" height="3" fill="#2a3242" opacity=".8"/>
  <!-- reflections -->
  <g opacity=".35">
    <rect x="470" y="790" width="10" height="150" fill="#aeb7c9" opacity=".14" filter="url(#soft)"/>
    <rect x="1090" y="800" width="12" height="130" fill="#aeb7c9" opacity=".12" filter="url(#soft)"/>
    <ellipse cx="300" cy="800" rx="220" ry="26" fill="url(#sheen)"/>
    <ellipse cx="760" cy="786" rx="260" ry="30" fill="url(#sheen)"/>
    <ellipse cx="1220" cy="802" rx="220" ry="26" fill="url(#sheen)"/>
  </g>

  <!-- chalk dust -->
  <g fill="#c9d2e2">
    <circle cx="420" cy="300" r="2.4" opacity=".4"/>
    <circle cx="512" cy="246" r="1.6" opacity=".3"/>
    <circle cx="880" cy="340" r="2" opacity=".34"/>
    <circle cx="1010" cy="230" r="1.5" opacity=".28"/>
    <circle cx="1340" cy="380" r="2.2" opacity=".3"/>
    <circle cx="660" cy="180" r="1.4" opacity=".26"/>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx=".5" cy=".46" r=".72">
    <stop offset=".62" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <rect width="1600" height="1000" fill="url(#vig)"/>
</svg>
