<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset=".5" stop-color="#0b0f16"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="haze" cx=".5" cy=".12" r=".5">
      <stop offset="0" stop-color="#98a2b8" stop-opacity=".13"/>
      <stop offset="1" stop-color="#98a2b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cfdd" stop-opacity=".16"/>
      <stop offset="1" stop-color="#c7cfdd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48526a"/>
      <stop offset=".5" stop-color="#1c222e"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="900" height="1400" fill="url(#bg)"/>
  <rect width="900" height="1400" fill="url(#haze)"/>

  <!-- pendant light -->
  <line x1="450" y1="0" x2="450" y2="180" stroke="#1c2230" stroke-width="3"/>
  <path d="M414 180h72l-10 32h-52z" fill="#151a24" stroke="#232b3b" stroke-width="2"/>
  <ellipse cx="450" cy="215" rx="58" ry="11" fill="#d7dee9" opacity=".5" filter="url(#soft)"/>
  <polygon points="406,212 494,212 640,760 260,760" fill="url(#cone)"/>

  <!-- back wall plate rack -->
  <g fill="#0d1118" opacity=".75">
    <rect x="90" y="420" width="12" height="260"/>
    <rect x="798" y="420" width="12" height="260"/>
    <rect x="90" y="500" width="720" height="10"/>
    <rect x="90" y="610" width="720" height="10"/>
    <circle cx="220" cy="540" r="40"/>
    <circle cx="300" cy="540" r="30"/>
    <circle cx="620" cy="540" r="38"/>
    <circle cx="540" cy="540" r="28"/>
  </g>

  <!-- plates leaning right wall -->
  <g fill="#0f141d" opacity=".9">
    <ellipse cx="840" cy="880" rx="52" ry="120"/>
    <ellipse cx="770" cy="900" rx="44" ry="104"/>
  </g>

  <!-- kettlebell pair on floor -->
  <g transform="translate(240 1120)">
    <ellipse cx="0" cy="80" rx="120" ry="14" fill="#000" opacity=".45" filter="url(#soft2)"/>
    <path d="M-24 -66 C -52 -66 -58 -32 -36 -14 C -66 5 -82 35 -82 58 A 82 66 0 0 0 82 58 C 82 35 66 5 36 -14 C 58 -32 52 -66 24 -66 Z" fill="url(#steel)" stroke="#28303f" stroke-width="3"/>
  </g>
  <g transform="translate(430 1160)">
    <ellipse cx="0" cy="76" rx="110" ry="13" fill="#000" opacity=".4" filter="url(#soft2)"/>
    <path d="M-20 -58 C -44 -58 -50 -28 -30 -12 C -56 4 -70 30 -70 50 A 70 56 0 0 0 70 50 C 70 30 56 4 30 -12 C 50 -28 44 -58 20 -58 Z" fill="url(#steel)" stroke="#28303f" stroke-width="3"/>
  </g>

  <!-- single dumbbell leaning bottom-left -->
  <g transform="translate(150 1300) rotate(-14)">
    <ellipse cx="60" cy="40" rx="120" ry="12" fill="#000" opacity=".4" filter="url(#soft2)"/>
    <rect x="-60" y="-7" width="240" height="13" rx="6" fill="#525d72"/>
    <rect x="-92" y="-40" width="30" height="80" rx="12" fill="url(#steel)"/>
    <rect x="182" y="-40" width="30" height="80" rx="12" fill="url(#steel)"/>
  </g>

  <!-- floor -->
  <rect y="1200" width="900" height="200" fill="#070a0f"/>
  <rect y="1200" width="900" height="2" fill="#2a3242" opacity=".7"/>
  <ellipse cx="450" cy="1214" rx="300" ry="18" fill="#aeb7c9" opacity=".08" filter="url(#soft)"/>

  <!-- chalk dust -->
  <g fill="#c9d2e2">
    <circle cx="300" cy="330" r="2.2" opacity=".35"/>
    <circle cx="560" cy="270" r="1.6" opacity=".3"/>
    <circle cx="700" cy="420" r="2" opacity=".3"/>
    <circle cx="180" cy="520" r="1.5" opacity=".26"/>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx=".5" cy=".45" r=".75">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".55"/>
  </radialGradient>
  <rect width="900" height="1400" fill="url(#vig)"/>
</svg>
