<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080b11"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <radialGradient id="haze" cx=".2" cy=".1" r=".6">
      <stop offset="0" stop-color="#98a2b8" stop-opacity=".14"/>
      <stop offset="1" stop-color="#98a2b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7cfdd" stop-opacity=".2"/>
      <stop offset="1" stop-color="#c7cfdd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5468"/>
      <stop offset=".5" stop-color="#1c222e"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset=".5" stop-color="#525d72"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>

  <rect width="1600" height="480" fill="url(#bg)"/>
  <rect width="1600" height="480" fill="url(#haze)"/>

  <!-- rack silhouette left -->
  <g fill="#0d1118" opacity=".8">
    <rect x="40" y="180" width="14" height="220"/>
    <rect x="330" y="180" width="14" height="220"/>
    <rect x="40" y="250" width="304" height="10"/>
    <rect x="40" y="330" width="304" height="10"/>
    <circle cx="120" cy="292" r="30"/>
    <circle cx="170" cy="292" r="24"/>
    <circle cx="262" cy="292" r="28"/>
  </g>

  <!-- floor bench + dumbbell rack right -->
  <g fill="#0d1118" opacity=".7">
    <rect x="1280" y="330" width="220" height="10"/>
    <rect x="1300" y="340" width="12" height="110"/>
    <rect x="1468" y="340" width="12" height="110"/>
    <rect x="1150" y="240" width="10" height="120"/>
    <rect x="1230" y="240" width="10" height="120"/>
    <rect x="1150" y="250" width="90" height="8"/>
  </g>

  <!-- hanging lights -->
  <g stroke="#1c2230" stroke-width="3">
    <line x1="560" y1="0" x2="560" y2="66"/>
    <line x1="1060" y1="0" x2="1060" y2="46"/>
  </g>
  <path d="M530 66h60l-8 26h-44z" fill="#151a24" stroke="#232b3b" stroke-width="2"/>
  <path d="M1030 46h60l-8 26h-44z" fill="#151a24" stroke="#232b3b" stroke-width="2"/>
  <ellipse cx="560" cy="95" rx="52" ry="10" fill="#d7dee9" opacity=".5" filter="url(#soft)"/>
  <ellipse cx="1060" cy="75" rx="52" ry="10" fill="#cdd6e4" opacity=".45" filter="url(#soft)"/>
  <polygon points="520,92 600,92 700,470 420,470" fill="url(#cone)"/>
  <polygon points="1024,72 1096,72 1196,470 924,470" fill="url(#cone)" opacity=".85"/>

  <!-- barbell resting on stand, center -->
  <g transform="translate(800 380)">
    <ellipse cx="0" cy="56" rx="460" ry="20" fill="#000" opacity=".5" filter="url(#soft2)"/>
    <rect x="-480" y="-10" width="960" height="18" rx="9" fill="url(#bar)"/>
    <rect x="-480" y="-10" width="960" height="5" rx="2.5" fill="#8a95a8" opacity=".5"/>
    <g>
      <rect x="-436" y="-70" width="38" height="138" rx="16" fill="url(#steel)"/>
      <rect x="-390" y="-64" width="20" height="126" rx="10" fill="url(#steel)"/>
      <rect x="370" y="-64" width="20" height="126" rx="10" fill="url(#steel)"/>
      <rect x="398" y="-70" width="38" height="138" rx="16" fill="url(#steel)"/>
    </g>
    <g fill="#161c28" stroke="#2a3242" stroke-width="2">
      <circle cx="-417" cy="0" r="72"/><circle cx="-417" cy="0" r="30" fill="#0d1118"/>
      <circle cx="417" cy="0" r="72"/><circle cx="417" cy="0" r="30" fill="#0d1118"/>
    </g>
    <circle cx="-417" cy="-72" r="5" fill="#9aa5b8" opacity=".65"/>
    <circle cx="417" cy="-72" r="5" fill="#9aa5b8" opacity=".65"/>
  </g>

  <!-- floor -->
  <rect y="440" width="1600" height="40" fill="#070a0f"/>
  <rect y="440" width="1600" height="2" fill="#2a3242" opacity=".7"/>
  <ellipse cx="560" cy="452" rx="240" ry="16" fill="#aeb7c9" opacity=".08" filter="url(#soft)"/>
  <ellipse cx="1060" cy="452" rx="240" ry="16" fill="#aeb7c9" opacity=".07" filter="url(#soft)"/>

  <!-- vignette -->
  <radialGradient id="vig" cx=".5" cy=".5" r=".75">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".5"/>
  </radialGradient>
  <rect width="1600" height="480" fill="url(#vig)"/>
</svg>
